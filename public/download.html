<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download ConfirmSlot</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
    }
    .container {
      padding: 20px;
    }
    h1 { margin-bottom: 10px; }
    p { margin-bottom: 20px; opacity: 0.9; }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Download ConfirmSlot</h1>
    <p>Taking you to the app store...</p>
    <div class="loader"></div>
  </div>
  <script>
    (function() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      
      // iOS detection
      const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      
      // Android detection
      const isAndroid = /android/i.test(ua);
      
      // Mobile detection (includes tablets)
      const isMobile = isIOS || isAndroid;

      if (isIOS) {
        // iOS - Redirect to App Store
        window.location.href = "https://apps.apple.com/in/app/confirmslot/id6758349903";
      } else if (isAndroid) {
        // Android - Redirect to Play Store
        window.location.href = "https://play.google.com/store/apps/details?id=com.identifier.confirmslot";
      } else {
        // Desktop or unknown - Redirect to main website
        window.location.href = "https://coslot.app";
      }
    })();
  </script>
</body>
</html>
